<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paridad SAT/ARS</title>
    <!-- Space Mono: tipografía hacker/monospaced principal -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <!-- Satoshi: tipografía secundaria corporativa limpia -->
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-pure: #000000;
            --orange-btc: #F7931A;
            --amber-accent: #FFD54F;
            --shadow-orange: #442200;

            /* Text shadow Option B: Alto Contraste (Blanco con aura naranja) */
            --glow-text:
                0 0 8px rgba(247, 147, 26, 0.8),
                0 0 25px rgba(247, 147, 26, 0.6),
                0 0 50px rgba(68, 34, 0, 0.9);

            /* Text shadow sutil para textos chicos */
            --glow-text-subtle: 0 0 5px rgba(247, 147, 26, 0.4);

            /* Glow Box Option A: Borde Neón Clásico */
            --glow-box:
                0 0 15px rgba(247, 147, 26, 0.15),
                inset 0 0 20px rgba(247, 147, 26, 0.05);
        }

        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: var(--bg-pure);
            color: #FFFFFF;
            /* Texto blanco dominante */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* ---------------------------------------------------- */
        /* CRT Scanlines Option B: Sutil Monocromo & Viñeta     */
        /* ---------------------------------------------------- */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(0deg,
                    rgba(0, 0, 0, 0.15),
                    rgba(0, 0, 0, 0.15) 1px,
                    transparent 1px,
                    transparent 3px);
            pointer-events: none;
            z-index: 10;
        }

        /* Falsa viñeta para simular curvatura del cristal */
        body::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            box-shadow: inset 0 0 80px rgba(0, 0, 0, 0.9);
            pointer-events: none;
            z-index: 11;
        }

        /* --------------------------------- */
        /* Contenedor Flotante               */
        /* --------------------------------- */
        .terminal-container {
            position: relative;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;

            /* Eliminamos el borde y fondo, dejamos un aura base suave simulando luz de piso */
            background: radial-gradient(ellipse at bottom, rgba(247, 147, 26, 0.08) 0%, transparent 70%);
            border-bottom: 1px solid rgba(247, 147, 26, 0.1);

            /* CRT Turn On Animation Base */
            opacity: 0;
            animation: crtTurnOn 0.6s 0.2s cubic-bezier(0.23, 1, 0.32, 1) forwards;
        }

        /* 3D sutil al pasar el mouse por encima (micro-animación) */
        /* .terminal-container:hover {
            transform: perspective(1000px) scale(1.02) rotateX(2deg);
            box-shadow:
                0 0 25px rgba(247, 147, 26, 0.25),
                inset 0 0 30px rgba(247, 147, 26, 0.1);
            border-color: rgba(247, 147, 26, 0.8);
        } */

        /* Contenido principal de texto */
        .main-display {
            font-family: 'Space Mono', monospace;
            font-weight: 700;
            font-size: clamp(2rem, 5vw, 4rem);
            text-align: center;
            text-shadow: var(--glow-text);
            margin: 0;
            line-height: 1.2;
            width: 17ch;
            display: flex;
            justify-content: center;
        }

        .value-wrapper {
            display: inline-flex;
            align-items: baseline;
            justify-content: flex-end;
        }

        #sat-ars-value {
            display: inline-block;
            text-align: right;
            min-width: 5.5ch;
        }

        /* "El Cursor" hacker (en Naranja porque el texto base es Blanco) */
        .blinking-cursor::after {
            content: '█';
            display: inline-block;
            margin-left: 8px;
            color: var(--orange-btc);
            text-shadow: 0 0 10px var(--orange-btc);
            animation: blink 1s step-end infinite;
            font-size: 1em;
            vertical-align: text-bottom;
        }

        /* Textos Secundarios */
        .secondary-info {
            font-family: 'Space Mono', monospace;
            /* Cambiamos a mono para que haga juego con lo ultra-hacker ahora sin el marco corporativo */
            font-size: 0.55rem;
            /* Escala mucho más pequeña como solicitaste */
            color: #777777;
            /* Neutral */
            text-align: center;
            margin-top: 6rem;
            /* Empujado más abajo */
            letter-spacing: 0.5px;
            text-transform: uppercase;
            line-height: 1.6;
        }

        .secondary-info p {
            margin: 0;
            /* Eliminado el margen agresivo entre P para juntarlos visualmente */
            text-shadow: var(--glow-text-subtle);
        }

        .update-info {
            margin-top: 8px !important;
            /* Separación sutil entre las líneas */
            color: #555555;
            font-size: 0.50rem;
            /* Aún más pequeño */
        }

        .accent {
            color: var(--orange-btc);
            font-weight: 700;
            text-shadow: 0 0 8px rgba(247, 147, 26, 0.4);
            /* Glow bajado a tono de letra chica */
        }

        /* Scramble / Update Effect */
        .glitch-text {
            animation: textGlitch 0.3s ease-out;
            color: var(--amber-accent) !important;
            text-shadow: 0 0 20px #FFF, 0 0 40px var(--amber-accent);
        }

        /* --------------------------------- */
        /* Animaciones                       */
        /* --------------------------------- */

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }
        }

        /* Encendido analógico CRT */
        @keyframes crtTurnOn {
            0% {
                opacity: 0;
                transform: scale(1, 0.001);
            }

            30% {
                opacity: 1;
                transform: scale(1, 0.005);
            }

            100% {
                opacity: 1;
                transform: scale(1, 1);
            }
        }

        @keyframes textGlitch {
            0% {
                transform: scale(1.05) skewX(2deg);
                opacity: 0.8;
            }

            20% {
                transform: scale(0.98) skewX(-2deg);
                opacity: 1;
                filter: hue-rotate(90deg);
            }

            40% {
                transform: scale(1.02) skewX(1deg);
                filter: blur(2px);
            }

            100% {
                transform: scale(1) skewX(0deg);
                filter: blur(0px);
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <div class="terminal-container">
        <h1 class="main-display">
            <span class="value-wrapper">1 SAT = <span id="sat-ars-value">--.--</span> ARS<span
                    class="blinking-cursor"></span></span>
        </h1>

        <div class="secondary-info">
            <p>1 BTC = <span id="btc-ars-value" class="accent">...</span> ARS [LEMON CASH]</p>
            <p class="update-info">LAST_UPDATE: <span id="last-update" class="accent">...</span></p>
        </div>
    </div>

    <script>
        const satValueEl = document.getElementById('sat-ars-value');
        const btcValueEl = document.getElementById('btc-ars-value');
        const timeValueEl = document.getElementById('last-update');
        let currentSatPrice = "--.--";

        // Efecto visual: Matrix Scramble Decrypt (Hackeo en tiempo real)
        function scrambleText(element, finalValue, duration = 600) {
            const chars = '0123456789$#%@*';
            const valueStr = finalValue.toString();
            let iterations = 0;
            const maxIterations = valueStr.length;
            const intervalTime = duration / (maxIterations * 3);

            // Clase CSS de sobre-billo
            element.classList.add('glitch-text');

            const scrambleInterval = setInterval(() => {
                element.innerText = valueStr.split('').map((char, index) => {
                    // Ciertos caracteres base saltan el efecto (punto o coma)
                    if (char === '.' || char === ',') return char;
                    if (index < iterations) return char; // Ya resueltos
                    return chars[Math.floor(Math.random() * chars.length)];
                }).join('');

                iterations += 1 / 3; // Velocidad de revelado gradual

                if (iterations >= valueStr.length) {
                    clearInterval(scrambleInterval);
                    element.innerText = finalValue;
                    setTimeout(() => element.classList.remove('glitch-text'), 300);
                }
            }, intervalTime);
        }

        async function fetchSatParity() {
            try {
                const response = await fetch('https://criptoya.com/api/lemoncash/btc/ars');
                if (!response.ok) throw new Error('CriptoYa Error');

                const data = await response.json();

                const btcPriceArs = data.ask;
                const satPriceArs = btcPriceArs / 100000000;
                const newSatText = satPriceArs.toFixed(2);

                // Si el valor cambia al actualizar, ejecutamos el Scramble Hacker
                if (currentSatPrice !== newSatText) {
                    currentSatPrice = newSatText;
                    scrambleText(satValueEl, currentSatPrice);
                }

                btcValueEl.innerText = new Intl.NumberFormat('es-AR').format(btcPriceArs);
                timeValueEl.innerText = new Date(data.time * 1000).toLocaleTimeString('es-AR', { hour12: false });

            } catch (error) {
                console.error("Fallo al obtener la API:", error);
                if (currentSatPrice === "--.--") satValueEl.innerText = 'ERR';
            }
        }

        // Ejecución tras una micro pausa para permitir la animación inicial de encendido
        setTimeout(fetchSatParity, 800);
        setInterval(fetchSatParity, 10000); // 10 segundos
    </script>
</body>

</html>
